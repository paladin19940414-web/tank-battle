<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101714">
  <meta name="description" content="一款无需安装、打开浏览器就能玩的复古坦克大战。">
  <title>钢铁前线 · 坦克大战</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=ZCOOL+XiaoWei&display=swap');
    :root{color-scheme:dark;--ink:#e8edda;--muted:#929d87;--lime:#c5eb79;--bg:#101714;--panel:#19231e;--line:#344439;--orange:#f2a65a}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#233329 0%,var(--bg) 63%);color:var(--ink);font-family:'ZCOOL XiaoWei',serif;display:grid;place-items:center;padding:24px}
    .shell{width:min(1100px,100%)} header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:0 0 18px}.eyebrow,.pixel{font-family:'Press Start 2P',monospace;text-transform:uppercase;letter-spacing:.08em}.eyebrow{font-size:9px;color:var(--lime);margin-bottom:10px}.title{font-size:clamp(34px,6vw,58px);line-height:1;margin:0;letter-spacing:.04em}.subtitle{color:var(--muted);font-size:16px;margin:9px 0 0}.badge{color:var(--lime);border:1px solid #526a4b;padding:9px 12px;border-radius:5px;font-size:13px;white-space:nowrap}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:16px;align-items:stretch}.game-frame{position:relative;padding:12px;background:#090e0c;border:1px solid #3b4b3d;border-radius:9px;box-shadow:0 22px 70px #0008,inset 0 0 0 1px #ffffff08}.screen{position:relative;overflow:hidden;border:1px solid #4c5e4c;border-radius:4px;background:#151d18;aspect-ratio:4/3}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#08100bd9;text-align:center;padding:24px;transition:opacity .2s}.overlay.hidden{opacity:0;pointer-events:none}.card{max-width:440px}.card h2{font-size:clamp(24px,4vw,40px);margin:0 0 12px;color:var(--lime)}.card p{color:#c2cbb8;font-size:17px;line-height:1.6;margin:0 auto 22px}.btn{border:0;border-radius:4px;background:var(--lime);color:#182218;font:16px 'ZCOOL XiaoWei',serif;padding:11px 24px;cursor:pointer;box-shadow:0 3px 0 #799d49;transition:transform .12s,filter .12s}.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}.side{display:flex;flex-direction:column;gap:12px}.panel{padding:16px;background:linear-gradient(145deg,#202c25,#17201b);border:1px solid var(--line);border-radius:7px}.panel h3{font-size:13px;color:var(--muted);margin:0 0 13px;font-weight:400;letter-spacing:.12em}.stat{display:flex;justify-content:space-between;align-items:center;font-size:17px;margin:9px 0}.stat strong{font:12px 'Press Start 2P',monospace;color:var(--lime)}.lives{color:var(--orange);letter-spacing:3px}.help{font-size:15px;line-height:1.75;color:#c6cfbf}.key{display:inline-grid;place-items:center;min-width:25px;padding:1px 5px;border:1px solid #607161;border-radius:3px;color:var(--ink);font:10px 'Press Start 2P',monospace}.dpad{display:grid;grid-template-columns:repeat(3,34px);grid-template-rows:repeat(2,30px);gap:4px;justify-content:center;margin:10px 0 13px}.dpad span{display:grid;place-items:center;border:1px solid #536452;background:#202c25;border-radius:4px;color:#d8e1cc;font-size:14px}.dpad .up{grid-column:2}.dpad .left{grid-column:1;grid-row:2}.dpad .down{grid-column:2;grid-row:2}.dpad .right{grid-column:3;grid-row:2}.footer{display:flex;justify-content:space-between;color:#7f8d7f;font-size:13px;padding:13px 3px 0}.sound{background:none;border:1px solid var(--line);border-radius:4px;color:var(--muted);padding:4px 9px;cursor:pointer;font:inherit}.sound:hover{color:var(--ink)}
    @media(max-width:760px){body{padding:16px}.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.help-panel{grid-column:1/-1}.game-frame{padding:7px}.badge{display:none}.footer{font-size:12px}}
    @media(max-width:430px){.side{grid-template-columns:1fr}.help-panel{grid-column:auto}.stat{font-size:15px}}
  </style>
</head>
<body>
  <main class="shell">
    <header><div><div class="eyebrow">ARCADE · 01</div><h1 class="title">钢铁前线</h1><p class="subtitle">守住基地，清除所有敌方坦克。</p></div><div class="badge">✦ 经典街机 · 即开即玩</div></header>
    <div class="layout">
      <section class="game-frame" aria-label="坦克大战游戏区域"><div class="screen"><canvas id="game" width="640" height="480" aria-label="坦克大战画面"></canvas><div id="overlay" class="overlay"><div class="card"><h2 id="overlay-title">准备出击</h2><p id="overlay-copy">穿过树林与砖墙，消灭来袭的敌军。别让基地被击中！</p><button class="btn" id="start">开始游戏</button></div></div></div><div class="footer"><span>WASD / 方向键移动 · 空格开火</span><button id="sound" class="sound" aria-label="切换音效">♫ 音效：开</button></div></section>
      <aside class="side">
        <section class="panel"><h3>战场数据</h3><div class="stat"><span>分数</span><strong id="score">00000</strong></div><div class="stat"><span>剩余敌军</span><strong id="remaining">08</strong></div><div class="stat"><span>生命</span><strong id="lives" class="lives">♥ ♥ ♥</strong></div><div class="stat"><span>关卡</span><strong>01</strong></div></section>
        <section class="panel"><h3>任务简报</h3><div class="help">驾驶你的坦克突破封锁，击毁全部敌军。保护地图底部的鹰徽基地。<br><br><span style="color:var(--orange)">▲</span> 橙色坦克会主动追击你。</div></section>
        <section class="panel help-panel"><h3>操作说明</h3><div class="dpad" aria-hidden="true"><span class="up">▲</span><span class="left">◀</span><span class="down">▼</span><span class="right">▶</span></div><div class="help"><span class="key">WASD</span> 或 <span class="key">←↑↓→</span> 移动<br><span class="key">空格</span> 发射炮弹<br><span class="key">P</span> 暂停游戏</div></section>
      </aside>
    </div>
  </main>
  <script>
  (()=>{
    const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height,T=32,C=20,R=15;
    const scoreEl=document.querySelector('#score'),remainingEl=document.querySelector('#remaining'),livesEl=document.querySelector('#lives'),overlay=document.querySelector('#overlay'),titleEl=document.querySelector('#overlay-title'),copyEl=document.querySelector('#overlay-copy'),startBtn=document.querySelector('#start');
    let map=[],player,enemies=[],bullets=[],score=0,lives=3,kills=0,frame=0,state='ready',sound=true,audio;
    const keys=new Set(),DIR={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
    function makeMap(){map=Array.from({length:R},(_,y)=>Array.from({length:C},(_,x)=>((x===0||x===C-1||y===0||y===R-1)?1:0)));for(let y=2;y<12;y+=3){for(let x=3+(y%2)*2;x<17;x+=5){if((x===8||x===9)&&y===11)continue;map[y][x]=Math.random()<.35?2:1;}}for(let y=11;y<14;y++)for(let x=8;x<12;x++)map[y][x]=0;}
    function reset(){makeMap();player={x:9.5*T,y:12.5*T,dir:'up',cool:0,invuln:100};enemies=[];bullets=[];score=0;kills=0;lives=3;spawnEnemies();updateHUD();}
    function spawnEnemies(){for(let i=0;i<8;i++){const spots=[[1,1],[9,1],[18,1],[4,1],[14,1],[2,4],[17,4],[10,2]];let [x,y]=spots[i];enemies.push({x:x*T,y:y*T,dir:'down',cool:30+i*17,turn:0,alive:true});}}
    function updateHUD(){scoreEl.textContent=String(score).padStart(5,'0');remainingEl.textContent=String(Math.max(0,8-kills)).padStart(2,'0');livesEl.textContent=Array.from({length:lives},()=> '♥').join(' ')||'—';}
    function sfx(freq=180,dur=.055){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.value=freq;g.gain.setValueAtTime(.025,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur);}catch{}}
    function blocked(x,y){let a=Math.floor(x/T),b=Math.floor(y/T);return a<0||b<0||a>=C||b>=R||map[b][a]===1||map[b][a]===2;}
    function move(t,dir,speed){let [dx,dy]=DIR[dir],nx=t.x+dx*speed,ny=t.y+dy*speed;t.dir=dir;let inset=5;if(!blocked(nx+inset,ny+inset)&&!blocked(nx+T-inset,ny+inset)&&!blocked(nx+inset,ny+T-inset)&&!blocked(nx+T-inset,ny+T-inset)){t.x=nx;t.y=ny;}}
    function shoot(t,enemy=false){let [dx,dy]=DIR[t.dir];bullets.push({x:t.x+T/2-4+dx*19,y:t.y+T/2-4+dy*19,dx,dy,enemy,life:90});sfx(enemy?115:260,.045);}
    function update(){if(state!=='playing')return;frame++;if(player.cool>0)player.cool--;if(player.invuln>0)player.invuln--;let dir=null;if(keys.has('ArrowUp')||keys.has('w'))dir='up';else if(keys.has('ArrowDown')||keys.has('s'))dir='down';else if(keys.has('ArrowLeft')||keys.has('a'))dir='left';else if(keys.has('ArrowRight')||keys.has('d'))dir='right';if(dir)move(player,dir,2.25);if((keys.has(' ')||keys.has('Space'))&&player.cool===0){shoot(player);player.cool=17;}
      for(const e of enemies){if(!e.alive)continue;if(--e.cool<=0){shoot(e,true);e.cool=75+Math.random()*60;}if(--e.turn<=0){let choices=['up','down','left','right'];let towardX=player.x-e.x,towardY=player.y-e.y;if(Math.random()<.55)choices=[Math.abs(towardX)>Math.abs(towardY)?(towardX>0?'right':'left'):(towardY>0?'down':'up'),...choices];e.dir=choices[Math.floor(Math.random()*Math.min(3,choices.length))];e.turn=45+Math.random()*70;}move(e,e.dir,.82);}
      for(const b of bullets){b.x+=b.dx*5.2;b.y+=b.dy*5.2;b.life--;let tx=Math.floor((b.x+4)/T),ty=Math.floor((b.y+4)/T);if(tx<0||ty<0||tx>=C||ty>=R||map[ty][tx]===1){b.life=0;continue;}if(map[ty][tx]===2){map[ty][tx]=0;b.life=0;sfx(90,.08);continue;}if(b.enemy&&b.x<player.x+T&&b.x+8>player.x&&b.y<player.y+T&&b.y+8>player.y){b.life=0;if(player.invuln===0){lives--;player.invuln=100;sfx(80,.2);if(lives<=0)finish(false);}continue;}if(!b.enemy){for(const e of enemies){if(e.alive&&b.x<e.x+T&&b.x+8>e.x&&b.y<e.y+T&&b.y+8>e.y){e.alive=false;b.life=0;kills++;score+=100;sfx(350,.1);break;}}}let bx=Math.floor((b.x+4)/T),by=Math.floor((b.y+4)/T);if(map[by]?.[bx]===0&&bx>=8&&bx<=11&&by>=13){b.life=0;if(b.enemy){finish(false);}}}
      bullets=bullets.filter(b=>b.life>0);updateHUD();if(kills>=8)finish(true);
    }
    function drawTank(t,color,isPlayer=false){if(!isPlayer&&!t.alive)return;ctx.save();ctx.translate(t.x+T/2,t.y+T/2);ctx.rotate(({up:0,right:Math.PI/2,down:Math.PI,left:-Math.PI/2})[t.dir]);ctx.fillStyle='#111';ctx.fillRect(-15,-14,30,28);ctx.fillStyle=color;ctx.fillRect(-10,-12,20,24);ctx.fillStyle=isPlayer?'#d9f18b':'#ffd09a';ctx.fillRect(-7,-7,14,14);ctx.fillStyle='#1b2019';ctx.fillRect(-3,-17,6,17);ctx.fillStyle=color;ctx.fillRect(-2,-11,4,10);ctx.fillStyle='#101510';ctx.fillRect(-14,-13,4,26);ctx.fillRect(10,-13,4,26);if(isPlayer&&t.invuln>0&&Math.floor(frame/5)%2===0){ctx.strokeStyle='#e9ff9c';ctx.lineWidth=2;ctx.strokeRect(-16,-16,32,32);}ctx.restore();}
    function draw(){ctx.fillStyle='#18211b';ctx.fillRect(0,0,W,H);for(let y=0;y<R;y++)for(let x=0;x<C;x++){let v=map[y][x],px=x*T,py=y*T;if(v===1){ctx.fillStyle='#995c3d';ctx.fillRect(px,py,T,T);ctx.fillStyle='#c37c50';ctx.fillRect(px+2,py+3,12,10);ctx.fillRect(px+18,py+18,12,11);ctx.fillStyle='#6d422f';ctx.fillRect(px+15,py,2,15);ctx.fillRect(px,py+14,16,2);ctx.fillRect(px+16,py+31,16,2);}else if(v===2){ctx.fillStyle='#777859';ctx.fillRect(px+5,py+6,22,20);ctx.fillStyle='#999a70';ctx.fillRect(px+9,py+3,14,24);ctx.fillStyle='#596047';ctx.fillRect(px+2,py+19,28,8);}else if((x+y)%2===0){ctx.fillStyle='#1b251e';ctx.fillRect(px,py,T,T);}}
      // Base insignia
      ctx.fillStyle='#d8ce87';ctx.fillRect(9*T+2,13*T+2,2*T-4,2*T-4);ctx.fillStyle='#374232';ctx.fillRect(9*T+6,13*T+6,2*T-12,2*T-12);ctx.fillStyle='#d8ce87';ctx.beginPath();ctx.moveTo(10*T,13*T+22);ctx.lineTo(10*T+16,13*T+9);ctx.lineTo(11*T,13*T+22);ctx.lineTo(11*T+16,13*T+9);ctx.lineTo(12*T,13*T+22);ctx.lineTo(10*T,13*T+22);ctx.fill();
      for(const e of enemies)drawTank(e,'#ce8051');drawTank(player,'#91bf62',true);ctx.fillStyle='#f6e795';for(const b of bullets)ctx.fillRect(b.x,b.y,8,8);}
    function finish(win){state=win?'win':'over';overlay.classList.remove('hidden');titleEl.textContent=win?'战场肃清！':'任务失败';copyEl.textContent=win?`漂亮的指挥官！你获得了 ${score} 分。`:'基地失守或你的坦克已被击毁，再试一次吧。';startBtn.textContent='再来一局';}
    function start(){reset();state='playing';overlay.classList.add('hidden');sfx(330,.12);}
    function loop(){update();draw();requestAnimationFrame(loop)}
    startBtn.addEventListener('click',start);document.querySelector('#sound').addEventListener('click',e=>{sound=!sound;e.currentTarget.textContent=`♫ 音效：${sound?'开':'关'}`;});
    window.addEventListener('keydown',e=>{let k=e.key.length===1?e.key.toLowerCase():e.key;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Space'].includes(k))e.preventDefault();keys.add(k);if(k==='p'&&state==='playing'){state='paused';overlay.classList.remove('hidden');titleEl.textContent='暂停';copyEl.textContent='按 P 继续作战，或整装再出发。';startBtn.textContent='重新开始';startBtn.onclick=()=>{startBtn.onclick=null;start();};}else if(k==='p'&&state==='paused'){state='playing';overlay.classList.add('hidden');}});window.addEventListener('keyup',e=>keys.delete(e.key.length===1?e.key.toLowerCase():e.key));window.addEventListener('blur',()=>keys.clear());reset();draw();loop();
  })();
  </script>
</body>
</html>
